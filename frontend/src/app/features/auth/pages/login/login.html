<div class="container" animate.enter="enter-animation">
    <div class="logo-and-name">
        <img class="logo-image" src="images/jarofmessages.png" alt="Jar of Messages logo">
        <h1>Jar of Messages</h1> 
    </div>

    <form pFocusTrap class="login-form" (ngSubmit)="onSubmit()">
        <p-iconfield>
            <p-inputicon>
                <i class="pi pi-envelope"> </i>
            </p-inputicon>
            <input 
                pInputText 
                type="email" 
                placeholder="Email" 
                [fluid]="true" 
                [formField]="loginForm.username" />
        </p-iconfield>

        <p-iconfield>
            <p-inputicon>
                <i class="pi pi-lock"> </i>
            </p-inputicon>
            <input 
                pInputText  
                [type]="showPassword() ? 'text' : 'password'"
                placeholder="Password" 
                [fluid]="true" 
                [formField]="loginForm.password" />

            <!-- Eye icon toggle -->
            <i 
                class="pi eye-icon-toggle" 
                onkeypress=""
                [ngClass]="!showPassword() ? 'pi-eye-slash' : 'pi-eye'"
                (click)="toggleWithAutoHidePassword()">
            </i>
        </p-iconfield>

        <div>
            <p-checkbox [formField]="loginForm.isAcceptedTerm" inputId="accept" [binary]="true" />
            <label for="accept">I agree to the terms and conditions.</label>
        </div>
    
        <p-button 
            type="submit" 
            label="Sign in" 
            [style]="{'width': '100%'}"
            [severity]="submitButtonSeverity()"
            [disabled]="loginForm().invalid() || !loginFormData().password || !loginFormData().username"/>
    </form>

    <div class="divider-with-text">
        <p-divider [style]="'max-width: 450px; width: 100%'" />
    
        <span style="white-space: nowrap;">Or Sign in with</span>
    
        <p-divider [style]="'max-width: 450px; width: 100%'" />
    </div>

    <div class="signups-option">
        <!-- <p-button icon="pi pi-google" [rounded]="true" [text]="true" [raised]="true" severity="danger" pTooltip="Google Account" tooltipPosition="top" />
        <p-button icon="pi pi-facebook" [rounded]="true" [text]="true" [raised]="true" severity="info" pTooltip="Facebook Account" tooltipPosition="top" />
        <p-button icon="pi pi-github" [rounded]="true" [text]="true" [raised]="true" severity="warn" pTooltip="Github Account" tooltipPosition="top" /> -->
        <app-google-login></app-google-login>
    </div>

    <div class="divider-with-text">
        <p-divider [style]="'max-width: 450px; width: 100%'" />
    
        <span>Or</span>
    
        <p-divider [style]="'max-width: 450px; width: 100%'" />
    </div>

    <p-button 
        label="Sign up" 
        [style]="{'width': '100%'}"
        [severity]="'success'"
        onkeypress=""
        (click)="navigateToSignupPage()" />
     
</div>
