<div class="histories">
  <div class="histories__card">
    <p-table
      [value]="bestRecords()"
      [paginator]="bestRecords().length > 5"
      [rows]="5"
      [rowsPerPageOptions]="[5, 10, 20]"
      [tableStyle]="{ 'min-width': '22rem' }"
      styleClass="histories__table p-datatable-sm"
      currentPageReportTemplate="Hiển thị {first} – {last} trong {totalRecords}"
      [showCurrentPageReport]="bestRecords().length > 5"
    >
      <ng-template #header>
        <tr>
          <th class="histories__col-center">#</th>
          <th>Player</th>
          <th>Date</th>
          <th>Completion Time</th>
        </tr>
      </ng-template>
      <ng-template #body let-history let-i="rowIndex">
        <tr class="histories__row">
          <td class="histories__col-center histories__index">{{ i + 1 }}</td>

          <td>{{ history.playerDisplayname }}</td>
          <td>{{ history.archivedTime | date:'dd/MM/yyyy - HH:mm' }}</td>
          <td>
            <span class="histories__time">
              {{ findNumberGameService.convertTimerToTimeDisplay(history.completionTime) }}
            </span>
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="4" class="histories__empty">
            <i class="pi pi-inbox"></i>
            <span>No games recorded yet.</span>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
