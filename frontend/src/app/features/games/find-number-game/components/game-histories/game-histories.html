<div class="histories">
  <p-table
    [value]="gameHistories()"
    [paginator]="gameHistories().length > 5"
    [rows]="5"
    [rowsPerPageOptions]="[5, 10, 20]"
    [tableStyle]="{ 'min-width': '22rem' }"
    styleClass="p-datatable-sm"
  >
    <ng-template #header>
      <tr>
        <th>#</th>
        <th>Ngày chơi</th>
        <th>Thời gian hoàn thành</th>
      </tr>
    </ng-template>
    <ng-template #body let-history let-i="rowIndex">
      <tr>
        <td>{{ i + 1 }}</td>
        <td>{{ history.startTime | date:'dd/MM/yyyy - HH:mm' }}</td>
        <td>
          <span class="histories__time">
            {{ findNumberGameService.convertTimerToTimeDisplay(history.timeToFinish) }}
          </span>
          @if (history.timeToFinish === bestTime()) {
          <p-tag icon="pi pi-star-fill" value="Kỷ lục" severity="warn" [rounded]="true" />
          }
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="3">
          <div class="histories__empty">
            <i class="pi pi-inbox"></i>
            <span>Chưa có ván nào được ghi nhận.</span>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
