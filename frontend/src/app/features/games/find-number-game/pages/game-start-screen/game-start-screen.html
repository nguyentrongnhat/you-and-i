<div class="find-number" animate.enter="enter-animation">
      <!-- <div class="find-number__orbs" aria-hidden="true">
         <span class="find-number__orb find-number__orb--1"></span>
         <span class="find-number__orb find-number__orb--2"></span>
         <span class="find-number__orb find-number__orb--3"></span>
      </div> -->

      <div class="find-number__column">
         <span class="find-number__badge">
            <i class="pi pi-search"></i>
            <span class="find-number__badge-ring"></span>
         </span>
         <h1 class="find-number__title">Tìm Số</h1>
         <p class="find-number__subtitle">
            Tìm và bấm lần lượt các số từ <strong>1</strong> đến
            <strong>{{ TOTAL_NUMBERS }}</strong> nhanh nhất có thể.
            Đồng hồ bắt đầu ngay khi bạn vào ván.
         </p>

         <div class="find-number__stats">
            <div class="find-number__cell">
               <i class="find-number__cell-icon pi pi-stopwatch"></i>
               <span class="find-number__cell-value">{{ bestTimeDisplay() }}</span>
               <span class="find-number__cell-label">Kỷ lục</span>
            </div>
            <div class="find-number__cell">
               <i class="find-number__cell-icon pi pi-flag"></i>
               <span class="find-number__cell-value">{{ totalGames() }}</span>
               <span class="find-number__cell-label">Số ván</span>
            </div>
         </div>

         <div class="find-number__actions">
            <p-button label="Bắt đầu" icon="pi pi-play" severity="contrast" (onClick)="startGame($event)" />
            <p-button label="Thành tích" icon="pi pi-chart-bar" severity="warn" styleClass="gold-button" (onClick)="showGameHistoriesDialog()" />
         </div>
      </div>

</div>

<p-dialog [modal]="true" [(visible)]="showGameHistories" [draggable]="false" [dismissableMask]="true"
   [style]="{ width: '52rem' }" [breakpoints]="{ '991px': '80vw', '575px': '94vw' }"
   styleClass="history-dialog">
   <ng-template #header>
      <div class="history-dialog__head">
         <span class="history-dialog__head-icon"><i class="pi pi-chart-bar"></i></span>
         <div class="history-dialog__head-text">
            <h3 class="history-dialog__head-title">Thành tích</h3>
            <span class="history-dialog__head-sub">Lịch sử &amp; bảng xếp hạng</span>
         </div>
      </div>
   </ng-template>
   <app-game-overview />
</p-dialog>


<p-dialog header="Hô Hô 😜" [modal]="true" [(visible)]="continueOrNewGameDialogVisible" [style]="{ width: '25rem' }">
   <span class="p-text-secondary block mb-3">Anh thấy em có ván game chưa hoàn thành.</span>
   <span class="p-text-secondary block mb-8">Em muốn chơi tiếp hay bắt đầu ván mới nào?</span>
   
   <div class="flex justify-end gap-2">
      <p-button label="Ván mới" severity="contrast" (click)="createNewGame()" />
      <p-button label="Chơi tiếp" variant="outlined" severity="contrast" (click)="loadUnfinishedGame()" />
   </div>
</p-dialog>
