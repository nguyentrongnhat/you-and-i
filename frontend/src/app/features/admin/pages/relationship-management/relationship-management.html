<div class="flex justify-end mb-4">
  <p-button
    label="Create Relationship"
    icon="pi pi-plus"
    (click)="navigateToCreateRelationship()"
  />
</div>

<div class="card">
  <p-dataview [value]="allRelationships()" [rows]="5" [paginator]="true">
    <ng-template #list let-items>
      <div class="grid grid-cols-12 gap-4 grid-nogutter">
        <div *ngFor="let item of items; let first = first" class="col-span-12">
          <div
            class="flex flex-col sm:flex-row sm:items-center p-6 gap-4"
            [ngClass]="{
              'border-t border-surface-200 dark:border-surface-700': !first,
            }"
          >
            <div class="md:w-40 relative">
              <img
                class="block xl:block mx-auto rounded-border w-full"
                src="https://primefaces.org/cdn/primeng/images/demo/product/bamboo-watch.jpg"
                [alt]="item.name ?? ''"
              />

              <p-tag
                [value]="item.status"
                severity="contrast"
                class="absolute"
                styleClass="dark:!bg-surface-900"
                [style.left.px]="4"
                [style.top.px]="4"
              />
            </div>

            <div class="flex flex-col md:flex-row justify-between md:items-center flex-1 gap-6">
              <div class="flex flex-row md:flex-col justify-between items-start gap-2">
                <div>
                  <span class="font-medium text-secondary text-sm">
                    {{ item.type }}
                  </span>

                  <div class="text-lg font-medium text-surface-900 dark:text-surface-0 mt-2">
                    {{ item?.name ?? '' }}
                  </div>
                </div>
              </div>

              <div class="flex flex-col md:items-end gap-8">
                <span class="text-xl font-semibold text-surface-900 dark:text-surface-0">
                  {{ item.members.length }} members
                </span>

                <div class="flex flex-row-reverse md:flex-row gap-2">
                  <p-button
                    icon="pi pi-pencil"
                    [outlined]="true"
                    (click)="navigateToRelationshipDetail(item.id)"
                  />

                  <p-button
                    icon="pi pi-trash"
                    severity="danger"
                    [outlined]="true"
                    (click)="confirmDeleteRelationship(item.id)"
                  />
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </ng-template>
  </p-dataview>
</div>

<!-- Delete dialog -->
<p-dialog
  [(visible)]="displayConfirmDeleteDialog"
  header="Delete relationship"
  [modal]="true"
  [draggable]="false"
  [dismissableMask]="true"
  appendTo="body"
  [style]="{ width: '26rem', 'max-width': '94vw' }"
>
  <p class="rd-dialog__text">
    <strong>{{ allRelationships().find(r => r.id === relationshipIdToDelete())?.name || 'This relationship' }}</strong>
    and its member list will be removed. This cannot be undone.
  </p>

  <div class="rd-dialog__actions">
    <p-button
      type="button"
      label="Cancel"
      severity="secondary"
      variant="outlined"
      (click)="cancelDeleteRelationship()"
    />

    <p-button
      type="button"
      label="Delete"
      icon="pi pi-trash"
      severity="danger"
      (click)="deleteRelationship()"
    />
  </div>
</p-dialog>
