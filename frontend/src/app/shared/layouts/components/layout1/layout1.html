<div class="wrapper" style="width: 100%;">
    <nav class="header">
        <i class="pi pi-bars size-menu-toggle-icon" (click)="toggleSideMenu()"></i>
        <div class="topbar-logo-render" (click)="navigateTo(this.ROUTE_PATHS.HOME.path)">
            <p-avatar image="/icons/jarofmessages.svg" class="mr-2" shape="circle" />
            Jar of Messages
        </div>

        <ul class="navigation-item">
            @for(item of this.navigationItems(); track item) {
                <li 
                    (click)="navigateTo(item.url)" 
                    tooltipPosition="bottom" pTooltip="{{item.name}}" 
                    [ngClass]="{'active': item.active}"
                >
                    <i class="pi {{item.icon}}"></i>
                </li>
            }
            
        </ul>

        <div class="account-and-setting">
            <p-avatar (click)="signOut()" image="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png" class="mr-2" shape="circle" />
        </div>
    </nav>


    <div class="side-menu-and-content">
        <div class="mini-side-menu" [ngClass]="{'expand': this.expandSideMenu()}">
            <ul class="navigation-item">
                @for(item of this.navigationItems(); track item) {
                    <li 
                        (click)="navigateTo(item.url)" 
                        tooltipPosition="right" pTooltip="{{item.name}}" 
                        [ngClass]="{'active': item.active}"
                    >
                            <i class="pi {{item.icon}}"></i>
                    </li>
                }
            </ul>
        </div>
        <div class="content max-w-[1200px] mx-auto" (scroll)="onContentScroll($event)">
            <ng-content></ng-content>
        </div>
    </div>

    <!-- Mobile bottom navigation -->
    <nav class="bottom-nav" [ngClass]="{ 'bottom-nav--hidden': hideBottomNav() }">
        <ul class="bottom-nav__list">
            @for (item of this.navigationItems(); track item) {
            <li
                class="bottom-nav__item"
                [ngClass]="{ 'active': item.active }"
                (click)="navigateTo(item.url)"
                pTooltip="{{ item.name }}"
                tooltipPosition="top"
            >
                <i class="pi {{ item.icon }}"></i>
            </li>
            }
        </ul>
    </nav>

</div>
