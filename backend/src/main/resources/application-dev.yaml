spring:
  application:
    name: you-and-i

  datasource:
    #url: jdbc:postgresql://localhost:5432/you-and-i
    #username: ${DB_USERNAME}
    #password: ${DB_PASSWORD}
    url: jdbc:postgresql://ep-tiny-thunder-a7uum1o3-pooler.ap-southeast-2.aws.neon.tech/you-and-i?&sslmode=require&channelBinding=require
    username: ${NEON_DB_USERNAME}
    password: ${NEON_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    table: flyway_schema_history

gmail:
  oauth2:
    client-id: ${GMAIL_CLIENT_ID}
    client-secret: ${GMAIL_CLIENT_SECRET}
    refresh-token: ${GMAIL_REFRESH_TOKEN}
    email: ${GMAIL_EMAIL}

account:
  super-admin:
    username: ${SUPER_ADMIN_USERNAME}
    password: ${SUPER_ADMIN_PASSWORD}


api:
  env:
    test: ${TEST_ENV:Không có biến môi trường!!!}